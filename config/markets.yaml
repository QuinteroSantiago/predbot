# Canonical market -> venue identifiers (design §12). Manually QA'd.
# Every entry MUST state both venues' resolution sources and whether they are
# identical; a mismatch is not tradeable regardless of edge. The Book Manager
# (Phase 2) refuses to key a snapshot to a canonical ID absent from this file.
#
# Cross-category basket, hand-QA'd against live Kalshi + Polymarket US rules on
# 2026-08-22 (auto-captured by Claude; human sign-off PENDING). Both venues here
# resolve on the same underlying event. Categories:
#   - US elections: chamber control + state Senate + state Governor, all Nov-3-2026.
#     Party-based on both; Kalshi resolves on the party candidate being *sworn in*
#     Jan-2027, Poly on the nominee *winning* Nov-3 (diverge only on a contested count).
#   - Monetary policy: Fed 2026 rate cut.
#   - Crypto: BTC above $200k / $250k during 2026 — BOTH settle on the SAME index
#     (CF Bitcoin Real-Time Index / BRTI), same threshold, same Jan-1-2027 deadline,
#     same "ever-above" semantic. Cleanest cross-venue match in the basket.
#   - Culture (awards): 78th Emmys Outstanding Drama Series, 4 nominees; both settle
#     on the Sep-14-2026 telecast per The Emmys / Television Academy.
#   - Tech (AI release): Grok 5 released before Oct-1-2026. Both define "release" the
#     same way (public availability, closed beta excluded, paid tier ok), same
#     deadline, sourced from xAI. Kalshi's is the cumulative "Before October" market.
#
# DELIBERATELY EXCLUDED after checking (resolution mismatch — do NOT re-add
# without re-QA): government shutdown (Kalshi KXGOVTSHUTDOWN-26OCT01 = "shut down
# AT 10am ET Oct 1" vs Poly "shutdown BY Oct 1" — a brief Sept shutdown splits them).

