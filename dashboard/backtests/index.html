<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backtest runs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="predbot backtest results: run history, maker vs taker, and per-run detail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Tokens follow the Fee Wall page (dashboard/template.html). Chart colors were
   checked with the dataviz palette validator against each mode's surface:
   gain/loss = blue/red (diverging), maker = accent, taker = gray (emphasis). */
:root{
  color-scheme: light;
  --ground:#f4f1ea; --surface:#ffffff; --surface-2:#faf8f2; --border:#e5e0d4;
  --ink:#181c20; --ink-2:#4c5660; --muted:#8a94a0;
  --accent:#9a6a12; --mark-accent:#9a6a12; --mark-muted:#8a94a0;
  --gain:#2a78d6; --loss:#c0463f; --grid:#ece7db;
  --kalshi:#2a78d6; --poly:#9a6a12;
  --size1:#d0a04a; --size2:#9a6a12; --size3:#5c3d05;
  --shadow: 0 1px 2px rgba(20,24,28,.05), 0 8px 24px rgba(20,24,28,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#0d1116; --surface:#151b21; --surface-2:#1b232b; --border:#28313b;
  --ink:#eef1f4; --ink-2:#aeb8c2; --muted:#78828e;
  --accent:#e0a95e; --mark-accent:#c08433; --mark-muted:#78828e;
  --gain:#3987e5; --loss:#e0685f; --grid:#1f2831;
  --kalshi:#3987e5; --poly:#c08433;
  --size1:#7a5319; --size2:#c08433; --size3:#efc583;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0d1116; --surface:#151b21; --surface-2:#1b232b; --border:#28313b;
  --ink:#eef1f4; --ink-2:#aeb8c2; --muted:#78828e;
  --accent:#e0a95e; --mark-accent:#c08433; --mark-muted:#78828e;
  --gain:#3987e5; --loss:#e0685f; --grid:#1f2831;
  --kalshi:#3987e5; --poly:#c08433;
  --size1:#7a5319; --size2:#c08433; --size3:#efc583;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace}
.num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1060px; margin:0 auto; padding:clamp(20px,4vw,52px) 16px 80px}
@media (min-width:700px){ .wrap{padding-left:clamp(16px,4vw,40px); padding-right:clamp(16px,4vw,40px)} }
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:clamp(30px,5.5vw,52px); line-height:1.04; letter-spacing:-.02em; margin:.35em 0 .1em; text-wrap:balance; overflow-wrap:anywhere}
.lede{font-size:clamp(15px,2vw,18px); color:var(--ink-2); max-width:62ch; margin:.6em 0 0}
h2{font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); font-weight:600; margin:44px 0 4px}
.h2note{font-size:14px; color:var(--muted); margin:0 0 16px; max-width:66ch}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px}
.back{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2); text-decoration:none; margin-bottom:6px}
.back:hover{color:var(--ink)}
.badge{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--border); border-radius:999px; padding:2px 10px; color:var(--ink-2); background:var(--surface-2); vertical-align:middle}
.key{display:inline-block; width:10px; height:10px; flex:none}
.key.maker{background:var(--mark-accent); border-radius:50%}
.key.taker{background:var(--mark-muted); border-radius:2px}
.key.kalshi{background:var(--kalshi); border-radius:2px}
.key.poly{background:var(--poly); border-radius:2px}
.key.together{background:var(--mark-muted); border-radius:2px}
.key.fade{background:var(--mark-accent); border-radius:50%}
.key.follow{background:var(--mark-muted); border-radius:2px}
.lk.s1{background:var(--size1)} .lk.s2{background:var(--size2)} .lk.s3{background:var(--size3)}
.multi{display:grid; grid-template-columns:1fr; gap:18px}
@media (min-width:860px){ .multi{grid-template-columns:1fr 1fr} }
.multi h3{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin:0 0 6px; font-weight:600}
.key.analysis{background:var(--ink-2); border-radius:2px; transform:rotate(45deg); width:8px; height:8px}
.acards{display:grid; grid-template-columns:1fr; gap:16px}
@media (min-width:760px){ .acards{grid-template-columns:1fr 1fr} }
.acard{display:block; text-decoration:none}
.acard:hover{border-color:var(--accent)}
.acard h3{font-family:"IBM Plex Mono",monospace; font-size:14px; letter-spacing:.06em; text-transform:uppercase; margin:0 0 8px; color:var(--ink-2); font-weight:600}
.acard .big{font-size:20px; font-weight:600; line-height:1.3}
.acard .sub{font-size:13px; color:var(--muted); margin-top:6px}
.verdict{font-size:17px; line-height:1.45; max-width:70ch; margin:18px 0 0}
.verdict b{font-weight:600}
.meta{display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--ink-2); font-size:14px; margin-top:12px}
.meta b{color:var(--ink); font-weight:600}
.dirty{color:var(--loss)}

/* filters: one row above everything they scope */
.filters{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:28px 0 0}
.filters label{font-size:13px; color:var(--ink-2); display:flex; gap:8px; align-items:center}
select{font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; max-width:100%}

/* stat tiles */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:18px}
/* Each tile outlines itself, so a part-filled last row stays surface, not a gray block. */
.stat{background:var(--surface); padding:16px 18px; min-width:0; outline:1px solid var(--border)}
.stat .v{font-family:"IBM Plex Sans",sans-serif; font-size:26px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.stat .l{font-size:12px; color:var(--muted); margin-top:3px; letter-spacing:.02em}
.stat .s{font-size:12px; color:var(--ink-2); margin-top:2px}
/* KPI row: a wide hero column, then as many standard tiles per row as fit. */
.stats.kpis{grid-template-columns:minmax(230px,1.7fr) repeat(auto-fit,minmax(135px,1fr))}
@media (max-width:640px){ .stats.kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .stat.hero{grid-column:1/-1} }
.stat.hero .v{font-size:clamp(40px,7vw,52px); line-height:1.05}

/* tables */
.tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap}
th{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--surface-2)}
td.r, th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover, tbody tr.link:focus-visible{background:var(--surface-2); outline:none}
tbody tr.link:focus-visible td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.better{font-weight:600}
.better::after{content:" ▲"; font-size:10px; color:var(--ink-2)}
.gainT{color:var(--ink)} .lossT{color:var(--ink)}

/* charts */
.chart{position:relative; width:100%}
.chart svg{display:block; width:100%; overflow:visible}
.chart svg:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:6px}
text.tick{fill:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:11px}
.gridline{stroke:var(--grid); stroke-width:1}
.zero{stroke:var(--muted); stroke-width:1}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--ink-2); margin:0 0 10px}
.legend span{display:inline-flex; align-items:center; gap:7px}
.tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow);
  padding:8px 11px; font-size:12px; color:var(--ink-2); white-space:nowrap; z-index:5; opacity:0; transition:opacity .08s}
.tip.on{opacity:1}
.tip strong{display:block; font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--ink); font-weight:600}
.tip .row{display:flex; align-items:center; gap:7px}
.tip .lk{display:inline-block; width:12px; height:2px}
details{margin-top:12px}
summary{cursor:pointer; font-size:13px; color:var(--ink-2); font-family:"IBM Plex Mono",monospace}
.empty{color:var(--ink-2); font-size:15px}
.empty code, .note code{font-family:"IBM Plex Mono",monospace; font-size:13px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 6px; overflow-wrap:anywhere}
.two{display:grid; grid-template-columns:1fr; gap:16px}
@media (min-width:860px){ .two{grid-template-columns:1fr 1fr} }
.note{font-size:13px; color:var(--muted); margin-top:10px}
.args{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow-wrap:anywhere; white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script>
"use strict";
const RUNS = "runs/";

// ---------- small DOM helpers (all data goes in as text, never HTML) ----------
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function sv(tag, attrs, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}

// ---------- formatting ----------
const usd = (v, signed) => {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const s = a >= 1e6 ? (a / 1e6).toFixed(2) + "M" : a >= 1e4 ? (a / 1e3).toFixed(1) + "k" : a.toFixed(2);
  const sign = v < 0 ? "−" : signed && v > 0 ? "+" : "";
  return sign + "$" + s;
};
const pct = (v, signed) => v == null || !isFinite(v) ? "—" : (v < 0 ? "−" : signed && v > 0 ? "+" : "") + Math.abs(v * 100).toFixed(Math.abs(v) < 0.1 ? 2 : 1) + "%";
const pct0 = v => Math.round(v * 100) + "%";
const count = n => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(2) + "G" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : n.toLocaleString();
const dur = s => s == null ? "—" : s < 90 ? s.toFixed(1) + "s" : s < 5400 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = d => MON[d.getMonth()] + " " + d.getDate();
const hm = d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
const when = t => { const d = new Date(t); return day(d) + " " + hm(d); };
const dataSpan = r => r.data_from && r.data_to ? span(r.data_from, r.data_to)
  : r.span_s ? "≈" + (r.span_s >= 172800 ? Math.round(r.span_s / 86400) + " days" : Math.round(r.span_s / 3600) + " hours") + " of data" : "—";
const span = (a, b) => { const x = new Date(a), y = new Date(b);
  return x.toDateString() === y.toDateString() ? day(x) + " " + hm(x) + "–" + hm(y) : day(x) + " – " + day(y) + " " + y.getFullYear(); };
const windowText = r => {
  if (r.from || r.to) return (r.from ? day(new Date(r.from)) : "start") + " → " + (r.to ? day(new Date(r.to)) : "end");
  return r.window_hours ? "last " + (r.window_hours % 24 === 0 ? r.window_hours / 24 + "d" : r.window_hours + "h") : "all data";
};
const runName = r => (r.label || "—") + (r.variant ? " · " + r.variant : "");
// The effective settings a run used. Runs from builds before 2026-09-22 didn't
// record them — and ran without the liquidity floor.
function paramsLine(run) {
  const p = run.params;
  if (!p) return el("p", {class: "note", style: "margin-top:10px"}, "Settings not recorded: this run's build predates 2026-09-22, when the backtest also ignored the liquidity floor (min depth). Re-run it for comparable numbers.");
  return el("p", {class: "note mono", style: "margin-top:10px"},
    `latency ${p.latency_ms}ms · min edge ${p.min_edge_cents}¢ · floor ${p.min_depth_contracts ? p.min_depth_contracts + " contracts" : "off"} · max clip ${p.max_clip_contracts} · Kalshi fee ×${p.kalshi_fee_mult} · skew ≤${p.max_skew_ms}ms · book age ≤${p.max_book_age_ms}ms`);
}
const fillRate = m => m && m.rests_placed ? m.rests_filled / m.rests_placed : null;
const modeBadge = (mode, adverse) => el("span", {class: "badge"}, el("span", {class: "key " + mode}), mode + (adverse ? " + adverse" : ""));

// Clean axis ticks: 1/2/5 × 10^n steps.
function niceTicks(lo, hi, n) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [], end = Math.ceil(hi / step - 1e-9) * step;
  for (let v = Math.floor(lo / step + 1e-9) * step; v <= end + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function timeTicks(t0, t1, n) {
  const out = [], d = (t1 - t0) / Math.max(1, n);
  for (let i = 0; i <= n; i++) out.push(t0 + d * i);
  return out;
}
const timeLabel = (t, spanMs) => { const d = new Date(t);
  return spanMs < 6e5 ? hm(d) + ":" + String(d.getSeconds()).padStart(2, "0") : spanMs < 2 * 864e5 ? hm(d) : day(d); };

// One tooltip element per chart, positioned inside the chart box.
function tooltip(box) {
  const tip = el("div", {class: "tip", role: "status", "aria-live": "polite"});
  box.append(tip);
  return {
    show(x, y, build) {
      tip.replaceChildren(...build());
      tip.classList.add("on");
      const bw = box.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = x + 14; if (left + tw > bw) left = x - tw - 14; if (left < 0) left = 0;
      let top = y - th - 10; if (top < 0) top = y + 14;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    },
    hide() { tip.classList.remove("on"); },
  };
}
const tipLine = (color, text) => el("div", {class: "row"}, el("span", {class: "lk", style: "background:" + color}), text);

// Redraw a chart when its box resizes.
function responsive(box, draw) {
  let w = 0;
  const ro = new ResizeObserver(() => { if (box.clientWidth !== w) { w = box.clientWidth; draw(w); } });
  ro.observe(box);
}

// ---------- data ----------
async function getJSON(path) {
  const r = await fetch(path, {cache: "no-cache"});
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
}
let INDEX = null;
async function loadIndex() {
  if (!INDEX) {
    try { INDEX = await getJSON(RUNS + "index.json"); } catch (e) { INDEX = {runs: [], error: String(e)}; }
  }
  return INDEX;
}

// ---------- router ----------
const app = document.getElementById("app");
async function route() {
  const m = location.hash.match(/^#run=([A-Za-z0-9_.-]+)$/);
  window.scrollTo(0, 0);
  if (m) await showRun(m[1]); else await showIndex();
}
window.addEventListener("hashchange", route);

// ---------- index view ----------
const FILTER = {label: null, mode: "all"};

async function showIndex() {
  document.title = "Backtest runs";
  const idx = await loadIndex();
  const runs = idx.runs || [];
  const head = [
    el("div", {class: "eyebrow"}, "predbot · backtests"),
    el("h1", {}, "Backtest runs"),
    el("p", {class: "lede"}, "Every replay of the recorded order books: how the maker and taker strategies compare and hold up as data accumulates, plus read-only analyses that look for other edges in the same data. Click a run for the full breakdown."),
  ];
  if (!runs.length) {
    app.replaceChildren(...head, el("div", {class: "card", style: "margin-top:28px"},
      el("p", {class: "empty"}, "No runs published yet. Run a backtest with ", el("code", {}, "-report-json run.json"),
        ", then publish it with ", el("code", {}, "scripts/publish-backtest.sh run.json"), "."),
      idx.error ? el("p", {class: "note"}, "(" + idx.error + ")") : null));
    return;
  }
  const labels = [...new Set(runs.map(r => r.label || "(no label)"))];
  const isTrading = r => (r.kind || "trading") === "trading";
  if (FILTER.label === null) FILTER.label = labels.length > 1 ? (runs[0].label || "(no label)") : "all";

  const labelSel = el("select", {"aria-label": "Label", onchange: e => { FILTER.label = e.target.value; showIndex(); }},
    el("option", {value: "all"}, "All labels"), labels.map(l => el("option", {value: l, selected: l === FILTER.label}, l)));
  const modeSel = el("select", {"aria-label": "Strategy", onchange: e => { FILTER.mode = e.target.value; showIndex(); }},
    ["all", "maker", "taker"].map(m => el("option", {value: m, selected: m === FILTER.mode}, m === "all" ? "Maker and taker" : m)));
  const byLabel = runs.filter(r => FILTER.label === "all" || (r.label || "(no label)") === FILTER.label);
  const shown = byLabel.filter(r => isTrading(r) && (FILTER.mode === "all" || r.mode === FILTER.mode));
  const analyses = byLabel.filter(r => !isTrading(r));

  const body = [el("div", {class: "filters"}, el("label", {}, "Runs", labelSel), el("label", {}, "Strategy", modeSel),
    el("span", {class: "note", style: "margin:0"}, (shown.length + analyses.length) + " of " + runs.length + " runs"))];

  if (!shown.length && !analyses.length) {
    body.push(el("p", {class: "empty", style: "margin-top:24px"}, "No runs match these filters."));
  } else if (!shown.length) {
    body.push(el("h2", {}, "Strategy runs"), el("p", {class: "h2note"}, "No maker or taker runs match these filters."));
  } else {
    body.push(headToHead(shown));
    const isSweep = new Set(shown.map(r => r.variant).filter(Boolean)).size >= 2;
    if (shown.length >= 2 && !isSweep) body.push(el("h2", {}, "Net P&L by run"),
      el("p", {class: "h2note"}, "Each point is one run, placed by when it finished. Only compare runs over the same kind of window — the label filter above keeps them apples to apples."),
      el("div", {class: "card"}, runsChart(shown)));
    if (isSweep) body.push(el("h2", {}, "By variant"),
      el("p", {class: "h2note"}, "Net P&L for each variant in the current filter — one bar per run, newest run per variant and mode. Bars that swing sign or collapse under small setting changes mean the result is fragile."),
      el("div", {class: "card"}, variantChart(shown)));
    body.push(el("h2", {}, "All strategy runs"), el("p", {class: "h2note"}, "Newest first. Select a row for its detail."), runsTable(shown));
  }
  if (analyses.length) body.push(...analysesSection(analyses));
  app.replaceChildren(...head, ...body);
}

function headToHead(runs) {
  const maker = runs.find(r => r.mode === "maker"), taker = runs.find(r => r.mode === "taker");
  const pair = [maker, taker].filter(Boolean);
  const wrap = [el("h2", {}, pair.length === 2 ? "Latest maker vs taker" : "Latest run"),
    el("p", {class: "h2note"}, pair.length === 2 ? "The most recent run of each mode in the current filter. ▲ marks the better value." : "Only one mode in the current filter.")];
  const rows = [
    ["Net P&L", r => r.net_pnl_usd, v => usd(v, true), 1],
    ["Annualized return", r => r.settled_pairs ? r.annualized : null, v => pct(v, true), 1],
    ["vs idle-balance hurdle", r => r.settled_pairs ? r.excess_annualized : null, v => pct(v, true), 1],
    ["Win rate", r => r.settled_pairs ? r.win_rate : null, v => pct(v), 1],
    ["Max drawdown", r => r.max_drawdown_usd, v => v ? usd(-v) : "$0.00", -1],
    ["Pairs completed / attempted", r => r.pairs_attempted ? r.pairs_completed / r.pairs_attempted : null, (v, r) => r.pairs_completed + " / " + r.pairs_attempted, 1],
    ["Maker rests filled", r => r.fill_rate, (v, r) => v == null ? "—" : pct(v) + " of " + r.rests_placed, 0],
    ["Data", r => null, (v, r) => dataSpan(r), 0],
    ["Snapshots", r => r.snapshots, v => count(v), 0],
    ["Finished", r => null, (v, r) => when(r.finished_at) + (r.duration_s ? " · " + dur(r.duration_s) : ""), 0],
  ];
  const thead = el("tr", {}, el("th", {}, ""), pair.map(r => el("th", {}, el("a", {href: "#run=" + r.id, style: "text-decoration:none"}, modeBadge(r.mode, r.adverse)))));
  const tbody = rows.map(([name, get, fmt, dir]) => {
    const vals = pair.map(get);
    let best = -1;
    if (pair.length === 2 && dir && vals.every(v => v != null && isFinite(v)) && vals[0] !== vals[1]) best = (vals[0] > vals[1]) === (dir > 0) ? 0 : 1;
    return el("tr", {}, el("td", {}, name), pair.map((r, i) => el("td", {class: "num" + (i === best ? " better" : "")}, fmt(vals[i], r))));
  });
  wrap.push(el("div", {class: "tablewrap"}, el("table", {}, el("thead", {}, thead), el("tbody", {}, tbody))));
  return el("div", {}, wrap);
}

function runsTable(runs) {
  const cols = [
    ["Finished", r => when(r.finished_at)],
    ["Label", r => [runName(r), r.imported ? el("span", {class: "note", style: "margin:0 0 0 6px"}, "imported") : null]],
    ["Mode", r => modeBadge(r.mode, r.adverse)],
    ["Data", r => dataSpan(r)],
    ["Net P&L", r => usd(r.net_pnl_usd, true), 1],

// Dot chart: one point per run, x = finish time, y = net P&L. Maker in the
// accent (circle), taker in gray (square) — shape backs up color.
function runsChart(runs) {
  const box = el("div", {class: "chart"});
  const legend = el("div", {class: "legend"},
    runs.some(r => r.mode === "maker") ? el("span", {}, el("span", {class: "key maker"}), "maker") : null,
    runs.some(r => r.mode === "taker") ? el("span", {}, el("span", {class: "key taker"}), "taker") : null);
  const out = el("div", {}, legend, box);
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = 240, m = {l: 64, r: 18, t: 12, b: 28};
    const ts = runs.map(r => Date.parse(r.finished_at)), vs = runs.map(r => r.net_pnl_usd);
    let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1) { t0 -= 36e5; t1 += 36e5; }
    const pad = (t1 - t0) * 0.04; t0 -= pad; t1 += pad;
    const yt = niceTicks(Math.min(0, ...vs), Math.max(0, ...vs), 4);
    const y0 = yt[0], y1 = yt[yt.length - 1];
    const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Net P&L by run; the runs table below has the same values"});
    for (const v of yt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 8, y: Y(v) + 4, "text-anchor": "end"}, usd(v)));
    const xt = timeTicks(t0 + pad, t1 - pad, Math.max(2, Math.min(5, Math.floor(W / 150))));
    for (const t of xt) svg.append(sv("text", {class: "tick", x: X(t), y: H - 8, "text-anchor": "middle"}, timeLabel(t, t1 - t0)));
    // Oldest first so the newest paints on top.
    runs.map((r, i) => ({r, x: X(ts[i]), y: Y(vs[i])})).reverse().forEach(({r, x, y}) => {
      const g = sv("g", {tabindex: "0", role: "link", "aria-label": `${r.mode} run ${when(r.finished_at)}: ${usd(r.net_pnl_usd, true)}`, style: "cursor:pointer"});
      const mark = r.mode === "maker"
        ? sv("circle", {cx: x, cy: y, r: 5, fill: "var(--mark-accent)", stroke: "var(--surface)", "stroke-width": 2})
        : sv("rect", {x: x - 5, y: y - 5, width: 10, height: 10, rx: 2, fill: "var(--mark-muted)", stroke: "var(--surface)", "stroke-width": 2});
      g.append(sv("circle", {cx: x, cy: y, r: 13, fill: "transparent"}), mark);
      const show = () => { mark.setAttribute("stroke-width", 3); tip.show(x, y, () => [
        el("strong", {}, usd(r.net_pnl_usd, true)),
        tipLine(r.mode === "maker" ? "var(--mark-accent)" : "var(--mark-muted)", r.mode + (r.label ? " · " + r.label : "")),
        el("div", {}, when(r.finished_at) + " · " + windowText(r))]); };
      const hide = () => { mark.setAttribute("stroke-width", 2); tip.hide(); };
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", show); g.addEventListener("blur", hide);
      g.addEventListener("click", () => { location.hash = "run=" + r.id; });
      g.addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "run=" + r.id; });
      svg.append(g);
    });
    box.prepend(svg);
  });
  return out;
}

// ---------- run detail view ----------

  head.push(paramsLine(run));
  const settled = rep.settled_pairs > 0;

    stat("vs idle-balance hurdle", settled ? pct(rep.excess_annualized, true) : "—", "hurdle " + pct(rep.idle_yield)),
    stat("Win rate", settled ? pct(rep.win_rate) : "—", "of " + rep.settled_pairs + " settled pairs"),

function stat(label, value, sub, hero) {
  return el("div", {class: "stat" + (hero ? " hero" : "")}, el("div", {class: "v"}, value), el("div", {class: "l"}, label), sub ? el("div", {class: "s"}, sub) : null);
}

// Step line of cumulative net over entry time, with a crosshair that snaps to
// the nearest pair. Arrow keys step through pairs when focused.
function equityChart(pairs) {
  const box = el("div", {class: "chart"});
  const tip = tooltip(box);
  let cum = 0;
  const pts = pairs.map(p => ({t: p.entry_ms, v: (cum += p.net_usd), p}));
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = 280, m = {l: 64, r: 18, t: 14, b: 28};
    let t0 = pts[0].t, t1 = pts[pts.length - 1].t; if (t0 === t1) { t0 -= 36e5; t1 += 36e5; }
    const yt = niceTicks(Math.min(0, ...pts.map(p => p.v)), Math.max(0, ...pts.map(p => p.v)), 4);
    const y0 = yt[0], y1 = yt[yt.length - 1];
    const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, tabindex: "0", role: "img",
      "aria-label": `Equity curve: ${pts.length} pairs, ending at ${usd(pts[pts.length - 1].v, true)}. Use arrow keys to step through pairs.`});
    for (const v of yt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 8, y: Y(v) + 4, "text-anchor": "end"}, usd(v)));
    for (const t of timeTicks(t0, t1, Math.max(2, Math.min(6, Math.floor(W / 140)))))
      svg.append(sv("text", {class: "tick", x: X(t), y: H - 8, "text-anchor": "middle"}, timeLabel(t, t1 - t0)));
    let d = `M${X(t0)},${Y(0)}`;
    for (const p of pts) d += `H${X(p.t)}V${Y(p.v)}`;
    d += `H${X(t1)}`;
    svg.append(sv("path", {d: d + `V${Y(0)}Z`, fill: "var(--mark-accent)", "fill-opacity": .1, stroke: "none"}),
      sv("path", {d, fill: "none", stroke: "var(--mark-accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    const last = pts[pts.length - 1];
    svg.append(sv("circle", {cx: X(t1), cy: Y(last.v), r: 4, fill: "var(--mark-accent)", stroke: "var(--surface)", "stroke-width": 2}));
    const cross = sv("line", {x1: 0, x2: 0, y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden"});
    const dot = sv("circle", {r: 5, fill: "var(--mark-accent)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden"});
    svg.append(cross, dot);
    let cur = -1;
    const at = i => {
      cur = Math.max(0, Math.min(pts.length - 1, i));
      const p = pts[cur], x = X(p.t), y = Y(p.v);
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("visibility", "visible");
      tip.show(x, y, () => [el("strong", {}, usd(p.v, true)),
        tipLine("var(--mark-accent)", "this pair " + usd(p.p.net_usd, true) + " · " + p.p.canonical),
        el("div", {}, when(p.t) + " · pair " + (cur + 1) + " of " + pts.length)]);
    };
    const off = () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hide(); };
    const hit = sv("rect", {x: m.l, y: m.t, width: Math.max(0, W - m.l - m.r), height: H - m.t - m.b, fill: "transparent"});
    hit.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), t = t0 + (e.clientX - r.left - m.l) / (W - m.l - m.r) * (t1 - t0);
      let lo = 0, hi = pts.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (pts[mid].t < t) lo = mid + 1; else hi = mid; }
      at(lo > 0 && Math.abs(pts[lo - 1].t - t) < Math.abs(pts[lo].t - t) ? lo - 1 : lo);
    });
    hit.addEventListener("pointerleave", off);
    svg.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); at(cur < 0 ? (e.key === "ArrowRight" ? 0 : pts.length - 1) : cur + (e.key === "ArrowRight" ? 1 : -1)); }
      if (e.key === "Home") { e.preventDefault(); at(0); }
      if (e.key === "End") { e.preventDefault(); at(pts.length - 1); }
    });
    svg.addEventListener("blur", off);
    svg.append(hit);
    box.prepend(svg);
  });
  return box;
}

// Horizontal bar, 4px rounded at the data end, square at the baseline.
function hbar(x0, x1, y, h) {
  const r = Math.min(4, Math.abs(x1 - x0) / 2, h / 2);
  if (Math.abs(x1 - x0) < 0.5) return `M${x0},${y}h0.5v${h}h-0.5Z`;
  if (x1 >= x0) return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
  return `M${x0},${y}H${x1 + r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 + r},${y + h}H${x0}Z`;
}

// Rows of labelled horizontal bars sharing one scale: used by the waterfall
// and the per-market chart. Each row: {label, from, to, color, value, tip[]}.
function barRows(rows, opts) {
  const box = el("div", {class: "chart"});
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const rowH = 30, barH = 16, labW = Math.min(opts.labelWidth || 150, W * 0.38), valW = 76;
    const H = rows.length * rowH + 24;
    const lo = Math.min(0, ...rows.map(r => Math.min(r.from, r.to))), hi = Math.max(0, ...rows.map(r => Math.max(r.from, r.to)));
    const x0 = labW + 8, x1 = W - valW, X = v => x0 + (v - lo) / ((hi - lo) || 1) * (x1 - x0);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": opts.aria});
    svg.append(sv("line", {class: "zero", x1: X(0), x2: X(0), y1: 0, y2: rows.length * rowH}));
    rows.forEach((r, i) => {
      const y = i * rowH + (rowH - barH) / 2, g = sv("g", {tabindex: "0", role: "img", "aria-label": r.label + ": " + r.valueText});
      const maxChars = Math.max(8, Math.floor(labW / 7.4));
      const label = r.label.length > maxChars ? r.label.slice(0, maxChars - 1) + "…" : r.label;
      const bar = sv("path", {d: hbar(X(r.from), X(r.to), y, barH), fill: r.color});
      g.append(sv("rect", {x: 0, y: i * rowH, width: W, height: rowH, fill: "transparent"}),
        sv("text", {x: labW, y: y + barH / 2 + 4, "text-anchor": "end", fill: r.strong ? "var(--ink)" : "var(--ink-2)", "font-size": 12,
          "font-family": "IBM Plex Mono, monospace", "font-weight": r.strong ? 600 : 400}, sv("title", {}, r.label), label),
        bar,
        sv("text", {x: Math.max(X(r.from), X(r.to)) + 6, y: y + barH / 2 + 4, fill: "var(--ink)", "font-size": 12,
          "font-family": "IBM Plex Mono, monospace", "font-weight": r.strong ? 600 : 400}, r.valueText));
      const show = () => { bar.setAttribute("fill-opacity", .78); const bx = Math.max(X(r.from), X(r.to));
        tip.show(Math.min(bx, W - 20), y, () => [el("strong", {}, r.valueText), ...(r.tip || []).map(t => el("div", {}, t))]); };
      const hide = () => { bar.removeAttribute("fill-opacity"); tip.hide(); };
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", show); g.addEventListener("blur", hide);
      svg.append(g);
    });
    for (const v of niceTicks(lo, hi, 4)) if (v >= lo - 1e-9 && v <= hi + 1e-9)
      svg.append(sv("text", {class: "tick", x: X(v), y: H - 6, "text-anchor": "middle"}, usd(v)));
    box.prepend(svg);
  });
  return box;
}

function waterfall(rep) {
  const rows = [];
  let run = 0;
  const step = (label, delta, tipText) => {
    rows.push({label, from: run, to: run + delta, color: delta >= 0 ? "var(--gain)" : "var(--loss)",
      valueText: usd(delta, true), tip: [label, tipText].filter(Boolean)});
    run += delta;
  };
  step("Gross captured", rep.gross_usd, "gap at realized fill prices");
  for (const [venue, fee] of Object.entries(rep.fees_by_venue_usd || {}).sort())
    step(venue + " fees", -fee, fee < 0 ? "net maker rebate" : "taker/maker fees paid");
  if (rep.legging_cost_usd) step("Legging exits", -rep.legging_cost_usd, "closing unhedged excess");
  rows.push({label: "Net P&L", from: 0, to: rep.net_pnl_usd, color: "var(--ink-2)", strong: true, valueText: usd(rep.net_pnl_usd, true), tip: ["Net P&L"]});
  const out = el("div", {}, barRows(rows, {labelWidth: 130, aria: "Waterfall from gross captured to net P&L"}));
  if (rep.slippage_usd) out.append(el("p", {class: "note"}, "Slippage vs top of book " + usd(-rep.slippage_usd, true) + " — already inside gross, shown for information."));
  return out;
}

function marketBars(markets) {

function variantChart(runs) {

// Mean adverse drift per horizon with 95% bars, against the rebate line.
function adverseChart(a) {
  const box = el("div", {class: "chart"});
  const tip = tooltip(box);
  const hs = a.horizons.filter(h => h.fills);
  if (!hs.length) return el("p", {class: "empty"}, "No fills measured — this window had no trade prints.");
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = 220, m = {l: 56, r: 18, t: 14, b: 28};
    const vals = hs.flatMap(h => [h.mean_cents - 1.96 * h.stderr_cents, h.mean_cents + 1.96 * h.stderr_cents]).concat([0, a.rebate_cents]);
    const yt = niceTicks(Math.min(...vals), Math.max(...vals), 4), y0 = yt[0], y1 = yt[yt.length - 1];
    const X = i => m.l + (i + 0.5) / hs.length * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Adverse drift by horizon; the table below has the same values"});
    for (const v of yt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 8, y: Y(v) + 4, "text-anchor": "end"}, v.toFixed(2) + "¢"));
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: Y(a.rebate_cents), y2: Y(a.rebate_cents), stroke: "var(--loss)", "stroke-width": 1.5}),
      sv("text", {class: "tick", x: W - m.r, y: Y(a.rebate_cents) - 6, "text-anchor": "end"}, "rebate " + a.rebate_cents + "¢ — above this, resting loses"));
    hs.forEach((h, i) => {
      const x = X(i), ci = 1.96 * h.stderr_cents;
      const g = sv("g", {tabindex: "0", role: "img", "aria-label": `${h.seconds}s: ${h.mean_cents.toFixed(3)}¢ over ${h.fills} fills`});
      const dot = sv("circle", {cx: x, cy: Y(h.mean_cents), r: 5, fill: "var(--mark-accent)", stroke: "var(--surface)", "stroke-width": 2});
      g.append(sv("rect", {x: x - 24, y: m.t, width: 48, height: H - m.t - m.b, fill: "transparent"}),
        sv("line", {x1: x, x2: x, y1: Y(h.mean_cents + ci), y2: Y(h.mean_cents - ci), stroke: "var(--mark-accent)", "stroke-width": 2, "stroke-opacity": .45, "stroke-linecap": "round"}), dot,
        sv("text", {class: "tick", x, y: H - 8, "text-anchor": "middle"}, h.seconds >= 60 ? h.seconds / 60 + " min" : h.seconds + "s"));
      const show = () => { dot.setAttribute("r", 6); tip.show(x, Y(h.mean_cents), () => [el("strong", {}, (h.mean_cents > 0 ? "+" : "") + h.mean_cents.toFixed(3) + "¢ drift"),
        el("div", {}, "±" + ci.toFixed(3) + "¢ · " + count(h.fills) + " fills"), el("div", {}, pct(h.against_share) + " moved against the maker")]); };
      const hide = () => { dot.setAttribute("r", 5); tip.hide(); };
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", show); g.addEventListener("blur", hide);
      svg.append(g);
    });
    box.prepend(svg);
  });
  return box;
}

// ---------- analyses (lead-lag, longshot) ----------
const ANALYSIS = {
  moves: {name: "Overreaction", q: "After a sharp price move or a burst of one-sided trading, does the price keep going or snap back — and does trading it pay after costs?"},
  leadlag: {name: "Lead-lag", q: "Does one exchange's price move before the other's?"},
  longshot: {name: "Longshot / calibration", q: "Do games resolve as often as their opening price implies?"},
};
const analysisBadge = kind => el("span", {class: "badge"}, el("span", {class: "key analysis"}), ANALYSIS[kind].name);

function movesVerdict(r) {
  if (!r.rows_readable) return "Too little data: no size band and horizon has 10+ games and 30+ events yet.";
  const cost = r.round_trip_cents != null ? ` A taker round trip costs about ${r.round_trip_cents.toFixed(1)}¢ in spread and fees.` : "";
  if (!r.edges) return `No edge after costs: across ${r.rows_readable} readable size/horizon combinations, neither fading nor following a move clears zero once you pay to trade it.` + cost;
  return `${r.edges} of ${r.rows_readable} combinations clear zero after costs. With this many tested, some will by chance — look for a pattern that holds across neighbouring sizes and horizons, and in each week.` + cost;
}

function leadlagVerdict(r) {
  const lagged = r.kalshi_leads + r.poly_leads;
  if (!r.analyzed) return "No market had enough two-exchange overlap to analyze.";
  const share = lagged / r.analyzed;
  if (share < 0.2) return `No usable lead: only ${lagged} of ${r.analyzed} markets show one exchange moving first. Prices move together or independently, so a lead-lag bot has little to trade on.`;
  const who = r.kalshi_leads >= r.poly_leads ? "Kalshi" : "Polymarket", n = Math.max(r.kalshi_leads, r.poly_leads);
  return `${who} tends to move first: ${n} of ${lagged} markets with a lead (median ${Math.abs(r.median_lead_s)}s, median strength |corr| ${r.median_peak_corr.toFixed(2)}). Worth a closer look — the lead has to beat fees and latency to be tradeable.`;
}
function longshotVerdict(r) {
  if (r.markets < 2) return "Not enough settled markets with price history to analyze.";
  if (!r.solid_buckets) return `Too little data: no price bucket has 30+ settled markets yet (${r.markets} markets in total). Any pattern here is noise.`;
  if (!r.clear_buckets) return `No clear mispricing: in every bucket with 30+ markets, how often YES happened is within noise of what the price implied.`;
  return `${r.clear_buckets} of ${r.solid_buckets} well-populated price buckets resolve YES clearly more or less often than priced — a possible calibration edge. Check which buckets, and whether the gap survives fees.`;
}

    const verdict = kind === "leadlag" ? leadlagVerdict(r) : kind === "moves" ? movesVerdict(r) : longshotVerdict(r);
    return el("a", {class: "card acard", href: "#run=" + r.id},

// Reliability diagram: bucket mean price (x) vs realized YES rate (y), with the
// y = x diagonal, 95% error bars, and the least-squares fit when it's usable.
function calibrationChart(r, fitUsable) {
  const box = el("div", {class: "chart"});
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = Math.min(420, Math.max(280, W * 0.55)), m = {l: 52, r: 18, t: 14, b: 40};
    const X = v => m.l + v * (W - m.l - m.r), Y = v => m.t + (1 - v) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Calibration chart; the bucket table below has the same values"});
    for (const v of [0, .25, .5, .75, 1]) svg.append(
      sv("line", {class: "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 8, y: Y(v) + 4, "text-anchor": "end"}, pct0(v)),
      sv("text", {class: "tick", x: X(v), y: H - m.b + 16, "text-anchor": "middle"}, pct0(v)));
    svg.append(sv("text", {class: "tick", x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle"}, "opening price (implied chance of YES)"),
      sv("line", {x1: X(0), y1: Y(0), x2: X(1), y2: Y(1), stroke: "var(--muted)", "stroke-width": 1}),
      sv("text", {class: "tick", x: X(.04), y: Y(.93), "text-anchor": "start"}, "underpriced YES"),
      sv("text", {class: "tick", x: X(.96), y: Y(.06), "text-anchor": "end"}, "overpriced YES"));
    if (fitUsable) {
      const f = v => Math.max(0, Math.min(1, r.intercept + r.slope * v));
      svg.append(sv("line", {x1: X(0), y1: Y(f(0)), x2: X(1), y2: Y(f(1)), stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-opacity": .5}));
    }
    for (const b of r.buckets) {
      const x = X(b.mean_implied), y = Y(b.realized), ci = 1.96 * b.stderr;
      const g = sv("g", {tabindex: "0", role: "img", "aria-label": `Priced ${pct(b.mean_implied)}, resolved YES ${pct(b.realized)}, ${b.n} markets`});
      const faint = b.n < 30 ? .45 : 1;
      g.append(sv("circle", {cx: x, cy: y, r: 14, fill: "transparent"}),
        sv("line", {x1: x, x2: x, y1: Y(Math.min(1, b.realized + ci)), y2: Y(Math.max(0, b.realized - ci)), stroke: "var(--mark-accent)", "stroke-width": 2, "stroke-opacity": .45 * faint, "stroke-linecap": "round"}));
      const dot = sv("circle", {cx: x, cy: y, r: 5, fill: "var(--mark-accent)", "fill-opacity": faint, stroke: "var(--surface)", "stroke-width": 2});
      g.append(dot);
      const show = () => { dot.setAttribute("r", 6); tip.show(x, y, () => [el("strong", {}, pct(b.realized) + " resolved YES"),
        el("div", {}, "priced " + pct(b.mean_implied) + " · edge " + pct(b.edge, true) + " ±" + pct(ci)),
        el("div", {}, b.n + " markets" + (b.n < 30 ? " — too few to read" : ""))]); };
      const hide = () => { dot.setAttribute("r", 5); tip.hide(); };
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", show); g.addEventListener("blur", hide);
      svg.append(g);
    }
    box.prepend(svg);
  });
  return box;
}

const hLabel = h => h === 0 ? "settle" : h >= 60 ? h / 60 + " min" : h + "s";

function showMoves(d) {
  const run = d.run, r = d.moves;
  document.title = "Overreaction · " + (run.label || run.id) + " · Backtest runs";
  const readable = r.rows.filter(x => x.markets >= 10 && x.events >= 30);
  const edges = readable.filter(isEdge);
  const costs = readable.filter(x => x.horizon_s).map(x => -(x.follow + x.fade) / 2);
  const summary = {rows_readable: readable.length, edges: edges.length, round_trip_cents: costs.length ? costs.reduce((a, b) => a + b, 0) / costs.length : null};
  const kpis = el("div", {class: "stats kpis"},
    stat("Edges after costs", edges.length + " / " + readable.length, "readable size × horizon combinations", true),
    stat("Price moves", count(r.move_events), `≥${r.move_cents}¢ within ${r.lookback_s}s`),
    stat("Flow bursts", count(r.flow_events), `≥${r.flow_contracts} contracts net within ${r.flow_window_s}s`),
    stat("Round-trip cost", summary.round_trip_cents != null ? summary.round_trip_cents.toFixed(1) + "¢" : "—", "spread + both fees, avg"),
    stat("Hold to settlement", r.settlement ? "included" : "—", r.settlement ? "from recorded outcomes" : "no outcomes loaded"));
  const triggers = [["move", "After a sharp price move", `The mid moved at least ${r.move_cents}¢ within ${r.lookback_s} seconds. Did it keep going, or snap back?`],
    ["flow", "After one-sided trading", `Takers bought (or sold) at least ${r.flow_contracts} contracts more than the other side within ${r.flow_window_s} seconds — the closest thing in this data to "the public" piling in. Did the price keep going, or reverse?`]];
  const sections = triggers.flatMap(([trig, title, note]) => {
    const rows = r.rows.filter(x => x.trigger === trig);
    if (!rows.length) return [el("h2", {}, title), el("p", {class: "empty"}, trig === "flow" ? "No trade prints in this window, so no flow events." : "No events.")];
    return [el("h2", {}, title), el("p", {class: "h2note"}, note + " Size bands with fewer than 10 games are left off the charts; they're in the table."),
      el("div", {class: "card"}, el("div", {class: "multi"}, ["kalshi", "polymarketus"].filter(v => rows.some(x => x.venue === v)).map(v =>
        el("div", {}, el("h3", {}, venueName(v)), continuationChart(rows.filter(x => x.venue === v), trig))))),
      el("p", {class: "h2note", style: "margin-top:14px"}, "Net profit per contract of actually trading it — with the move (follow) or against it (fade) — entering and exiting at the real bid/ask and paying both fees. Only combinations with 10+ games and 30+ events are shown; ▲ marks one whose 95% range clears zero."),
      el("div", {class: "card"}, forestPlot(rows.filter(x => x.markets >= 10 && x.events >= 30)))];
  });
  app.replaceChildren(...analysisHeader(run).filter(Boolean),
    el("p", {class: "verdict"}, movesVerdict(summary)),
    kpis, ...sections,
    el("h2", {}, "All combinations"),
    el("p", {class: "h2note"}, "Every trigger, exchange, size band and horizon. Continuation is before costs (+ kept going, − snapped back); follow and fade are after costs. ± is a 95% range clustered by game; n/a means one game, where no honest range exists."),
    movesTable(r.rows));
}

// Mid continuation (before costs) by horizon, one line per size band.
function continuationChart(rows, trig) {
  // Same bar as the forest plot: a band backed by a handful of games swings
  // enough to look like a pattern. Those stay in the table.
  rows = rows.filter(x => x.markets >= 10 && x.events >= 30);
  if (!rows.some(x => x.horizon_s)) return el("p", {class: "empty"}, "No size band has 10+ games and 30+ events here yet.");
  const bands = [...new Map(rows.map(x => [x.bucket, x.bucket_lo])).entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
  const hs = [...new Set(rows.filter(x => x.horizon_s).map(x => x.horizon_s))].sort((a, b) => a - b);
  const box = el("div", {class: "chart"});
  const legend = el("div", {class: "legend"}, bands.map((b, i) => el("span", {}, el("span", {class: "lk s" + Math.min(3, i + 1), style: "display:inline-block;width:14px;height:2px"}), b + (trig === "flow" ? " contracts" : ""))));
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = 200, m = {l: 48, r: 14, t: 10, b: 26};
    const pts = rows.filter(x => x.horizon_s);
    const vals = pts.map(x => x.cont).concat([0]);
    const yt = niceTicks(Math.min(...vals), Math.max(...vals), 4), y0 = yt[0], y1 = yt[yt.length - 1];
    const X = i => m.l + (hs.length === 1 ? 0.5 : i / (hs.length - 1)) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Price continuation by horizon; the table below has the same values"});
    for (const v of yt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 6, y: Y(v) + 4, "text-anchor": "end"}, (v > 0 ? "+" : "") + v + "¢"));
    hs.forEach((h, i) => svg.append(sv("text", {class: "tick", x: X(i), y: H - 6, "text-anchor": "middle"}, hLabel(h))));
    svg.append(sv("text", {class: "tick", x: m.l + 4, y: m.t + 10}, "kept going ↑"), sv("text", {class: "tick", x: m.l + 4, y: H - m.b - 4}, "snapped back ↓"));
    bands.forEach((b, bi) => {
      const color = `var(--size${Math.min(3, bi + 1)})`;
      const series = hs.map((h, i) => ({i, row: pts.find(x => x.bucket === b && x.horizon_s === h)})).filter(p => p.row);
      if (!series.length) return;
      svg.append(sv("path", {d: series.map((p, k) => (k ? "L" : "M") + X(p.i) + "," + Y(p.row.cont)).join(""), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round"}));
      for (const p of series) {
        const x = X(p.i), y = Y(p.row.cont);
        const g = sv("g", {tabindex: "0", role: "img", "aria-label": `${b}, ${hLabel(p.row.horizon_s)}: ${p.row.cont.toFixed(2)}¢`});
        const dot = sv("circle", {cx: x, cy: y, r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2});
        g.append(sv("circle", {cx: x, cy: y, r: 12, fill: "transparent"}), dot);
        const show = () => { dot.setAttribute("r", 5); tip.show(x, y, () => [el("strong", {}, (p.row.cont > 0 ? "+" : "") + p.row.cont.toFixed(2) + "¢ " + (p.row.cont >= 0 ? "kept going" : "snapped back")),
          el("div", {}, b + " · after " + hLabel(p.row.horizon_s)), el("div", {}, "±" + (1.96 * p.row.cont_se).toFixed(2) + "¢ · " + p.row.events + " events in " + p.row.markets + " games")]); };
        const hide = () => { dot.setAttribute("r", 4); tip.hide(); };
        g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
        g.addEventListener("focus", show); g.addEventListener("blur", hide);
        svg.append(g);
      }
    });
    box.prepend(svg);
  });
  return el("div", {}, legend, box);
}

// One row per exchange × size × horizon: fade (accent circle) and follow (gray
// square) net P&L with 95% bars, against zero.
function forestPlot(rows) {
  if (!rows.length) return el("p", {class: "empty"}, "No combination has 10+ games and 30+ events yet.");
  const box = el("div", {class: "chart"});
  const legend = el("div", {class: "legend"}, el("span", {}, el("span", {class: "key fade"}), "fade (trade against it)"), el("span", {}, el("span", {class: "key follow"}), "follow (trade with it)"));
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const narrow = W < 600, fs = narrow ? 11 : 12;
    const labelOf = x => narrow
      ? ({polymarketus: "Poly", kalshi: "Kal"}[x.venue] || x.venue) + " · " + x.bucket + " · " + hLabel(x.horizon_s).replace(" min", "m")
      : venueName(x.venue) + " · " + x.bucket + " · " + hLabel(x.horizon_s);
    // Size the label column to the longest label (mono: ~0.61em per char, +2 for "▲ ").
    const longest = Math.max(...rows.map(x => labelOf(x).length + 2));
    const rowH = 26, labW = Math.min(W * 0.5, longest * fs * 0.61 + 6), m = {l: labW + 10, r: 16, t: 6, b: 24}, H = rows.length * rowH + m.t + m.b;
    const vals = rows.flatMap(x => [x.fade - 1.96 * x.fade_se, x.fade + 1.96 * x.fade_se, x.follow - 1.96 * x.follow_se, x.follow + 1.96 * x.follow_se]).concat([0]);
    const xt = niceTicks(Math.min(...vals), Math.max(...vals), 5), x0 = xt[0], x1 = xt[xt.length - 1];
    const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Net P&L after costs, fade vs follow; the table below has the same values"});
    for (const v of xt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: X(v), x2: X(v), y1: m.t, y2: H - m.b}),
      sv("text", {class: "tick", x: X(v), y: H - 6, "text-anchor": "middle"}, (v > 0 ? "+" : "") + v + "¢"));
    rows.forEach((x, i) => {
      const y = m.t + i * rowH + rowH / 2, edge = isEdge(x);
      const label = labelOf(x);
      svg.append(sv("text", {x: labW, y: y + 4, "text-anchor": "end", fill: edge ? "var(--ink)" : "var(--ink-2)", "font-size": fs, "font-family": "IBM Plex Mono, monospace", "font-weight": edge ? 600 : 400}, (edge ? "▲ " : "") + label));
      const g = sv("g", {tabindex: "0", role: "img", "aria-label": `${label}: fade ${x.fade.toFixed(2)}¢, follow ${x.follow.toFixed(2)}¢`});
      g.append(sv("rect", {x: 0, y: y - rowH / 2, width: W, height: rowH, fill: "transparent"}));
      const mark = (v, se, dy, fade) => {
        const cy = y + dy;
        g.append(sv("line", {x1: X(v - 1.96 * se), x2: X(v + 1.96 * se), y1: cy, y2: cy, stroke: fade ? "var(--mark-accent)" : "var(--mark-muted)", "stroke-width": 2, "stroke-opacity": .45, "stroke-linecap": "round"}));
        g.append(fade ? sv("circle", {cx: X(v), cy, r: 4, fill: "var(--mark-accent)", stroke: "var(--surface)", "stroke-width": 2})
          : sv("rect", {x: X(v) - 4, y: cy - 4, width: 8, height: 8, rx: 1.5, fill: "var(--mark-muted)", stroke: "var(--surface)", "stroke-width": 2}));
      };
      mark(x.fade, x.fade_se, -4, true); mark(x.follow, x.follow_se, 4, false);
      const show = () => tip.show(X(Math.max(x.fade, x.follow)), y, () => [el("strong", {}, label),
        tipLine("var(--mark-accent)", "fade " + (x.fade > 0 ? "+" : "") + x.fade.toFixed(2) + "¢ ±" + (1.96 * x.fade_se).toFixed(2)),
        tipLine("var(--mark-muted)", "follow " + (x.follow > 0 ? "+" : "") + x.follow.toFixed(2) + "¢ ±" + (1.96 * x.follow_se).toFixed(2)),
        el("div", {}, x.events + " events in " + x.markets + " games" + (edge ? " · " + edge + " clears zero" : ""))]);
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", () => tip.hide());
      g.addEventListener("focus", show); g.addEventListener("blur", () => tip.hide());
      svg.append(g);
    });
    box.prepend(svg);
  });
  return el("div", {}, legend, box);
}

function movesTable(rows) {
  const ci = (x, v, se) => x.markets < 2 ? (v > 0 ? "+" : "") + v.toFixed(2) + " n/a" : (v > 0 ? "+" : "") + v.toFixed(2) + " ±" + (1.96 * se).toFixed(2);
  return el("div", {class: "tablewrap", style: "max-height:460px; overflow:auto"}, el("table", {},
    el("thead", {}, el("tr", {}, ["Trigger", "Exchange", "Size", "After"].map(h => el("th", {}, h)), ["Events", "Games", "Continuation", "Follow", "Fade"].map(h => el("th", {class: "r"}, h)), el("th", {}, "Edge"))),
    el("tbody", {}, rows.map(x => { const e = isEdge(x); return el("tr", {},
      el("td", {}, x.trigger === "move" ? "price move" : "flow burst"), el("td", {}, venueName(x.venue)), el("td", {class: "num"}, x.bucket), el("td", {}, hLabel(x.horizon_s)),
      el("td", {class: "r num"}, x.events), el("td", {class: "r num"}, x.markets), el("td", {class: "r num"}, ci(x, x.cont, x.cont_se)),
      el("td", {class: "r num" + (e === "follow" ? " better" : "")}, ci(x, x.follow, x.follow_se)), el("td", {class: "r num" + (e === "fade" ? " better" : "")}, ci(x, x.fade, x.fade_se)),
      el("td", {}, e || "—")); }))));
}

// Columns: how many markets peak at each lag. Poly-first left, Kalshi-first
// right, together (lag 0) gray; the legend and axis labels back up the color.
function lagHistogram(markets, r) {
  const counts = new Map();
  for (const m of markets) counts.set(m.peak_lag_s, (counts.get(m.peak_lag_s) || 0) + 1);
  const maxLag = r.max_lag_s, maxN = Math.max(...counts.values());
  const box = el("div", {class: "chart"});
  const legend = el("div", {class: "legend"},
    el("span", {}, el("span", {class: "key poly"}), "Polymarket first"),
    el("span", {}, el("span", {class: "key together"}), "together"),
    el("span", {}, el("span", {class: "key kalshi"}), "Kalshi first"));
  const tip = tooltip(box);
  responsive(box, W => {
    box.querySelector("svg")?.remove();
    const H = 240, m = {l: 44, r: 12, t: 12, b: 34};
    const slots = 2 * maxLag + 1, slotW = (W - m.l - m.r) / slots, bw = Math.max(2, Math.min(24, slotW - 2));
    const X = lag => m.l + (lag + maxLag + 0.5) * slotW, yt = niceTicks(0, maxN, 4), top = yt[yt.length - 1];
    const Y = v => m.t + (1 - v / top) * (H - m.t - m.b);
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Markets by peak lag; the markets table below has the same values"});
    for (const v of yt) svg.append(sv("line", {class: v === 0 ? "zero" : "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}),
      sv("text", {class: "tick", x: m.l - 8, y: Y(v) + 4, "text-anchor": "end"}, v));
    const step = maxLag >= 10 ? 5 : 1;
    for (let lag = -maxLag; lag <= maxLag; lag += step)
      svg.append(sv("text", {class: "tick", x: X(lag), y: H - m.b + 16, "text-anchor": "middle"}, (lag > 0 ? "+" : "") + lag + "s"));
    svg.append(sv("text", {class: "tick", x: m.l, y: H - 4, "text-anchor": "start"}, "← Polymarket first"),
      sv("text", {class: "tick", x: W - m.r, y: H - 4, "text-anchor": "end"}, "Kalshi first →"));
    for (const [lag, n] of counts) {
      const x = X(lag) - bw / 2, y = Y(n), h = Y(0) - y, rr = Math.min(4, bw / 2, h);
      const color = lag < 0 ? "var(--poly)" : lag > 0 ? "var(--kalshi)" : "var(--mark-muted)";
      const g = sv("g", {tabindex: "0", role: "img", "aria-label": `${n} markets at lag ${lag}s`});
      const bar = sv("path", {d: `M${x},${Y(0)}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + bw - rr}Q${x + bw},${y} ${x + bw},${y + rr}V${Y(0)}Z`, fill: color});
      g.append(sv("rect", {x: X(lag) - slotW / 2, y: m.t, width: slotW, height: H - m.t - m.b, fill: "transparent"}), bar,
        sv("text", {x: X(lag), y: y - 5, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 11, "font-family": "IBM Plex Mono, monospace"}, n));
      const show = () => { bar.setAttribute("fill-opacity", .78); tip.show(X(lag), y, () => [el("strong", {}, n + " market" + (n === 1 ? "" : "s")),
        el("div", {}, lag === 0 ? "move together (lag 0)" : (lag < 0 ? "Polymarket" : "Kalshi") + " first by " + Math.abs(lag) + "s")]); };
      const hide = () => { bar.removeAttribute("fill-opacity"); tip.hide(); };
      g.addEventListener("pointerenter", show); g.addEventListener("pointerleave", hide);
      g.addEventListener("focus", show); g.addEventListener("blur", hide);
      svg.append(g);
    }
    box.prepend(svg);
  });
  return el("div", {}, legend, box);
}

route();
