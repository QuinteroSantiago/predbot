name: ci
on:
  push:
    branches: [main]
  pull_request:

# Tests only. Nothing here deploys: both bots can place real orders, so
# installing code and arming trading are separate manual steps.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [tradekit, predbot, etfbot]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test ./... -race -count=1
      - name: Cross-compile for linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./...
