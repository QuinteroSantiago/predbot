name: ci
on:
  push:
    branches: [main]
  pull_request:

# Tests only. This pipeline never deploys: predbot placed real orders, so
# installing code and arming trading were separate manual steps.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test ./... -race -count=1
      - name: Cross-compile the live binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/live
